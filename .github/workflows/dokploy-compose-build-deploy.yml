# Build the three images of deploy/site/docker-compose.yml (landing, mastra, playground) ONCE in GitHub Actions, copy them to
# our registry by digest, and have Dokploy deploy those digests, so Dokploy stops building upup from source. The work is done by
# the org's shared workflow, DevinoSolutions/.github dokploy-compose.yml, pinned below to a full commit sha. Setup guide and the
# per-compose cutover runbook: README of DevinoSolutions/.github, "Deploy a compose project to Dokploy with GitHub Actions".
# deploy/site/docker-compose.yml is NOT changed: it keeps its build blocks (and `docker compose up --build` keeps working); the
# digest-pinned copy exists only inside the deploy job and in Dokploy.
#
# THE KILL SWITCHES are two repository variables, one per branch. Unset (or empty) means a push or a manual run of that branch
# does NOTHING here: nothing is built, no registry or Dokploy secret is read, Dokploy keeps building from git.
#     UPUP_DIGEST_DEV    dev    branch -> the dev compose  (DOKPLOY_COMPOSE_ID_DEV)
#     UPUP_DIGEST_PROD   master branch -> the prod compose (DOKPLOY_COMPOSE_ID_PROD)
#     (unset or empty)  off
#     mirror            build, mirror to our registry, render the compose and print it in the job summary. No Dokploy.
#     all               build, mirror, render and deploy the whole compose by digest
# Anything else in a variable fails the gate job. A pull request only ever builds (never mirrors, never deploys), only from a
# branch of this repository (never a fork or Dependabot), and only when it touches a file that can change how the images are
# built. A compose is switched to a raw source by hand BEFORE its variable is set to `all` (README runbook, step 4); the first
# deploy after that is a manual run with `confirm_reconciled`.
#
# DEV AND PROD VALUES STAY SEPARATE. The landing and playground images inline their NEXT_PUBLIC_* values at build time, so each
# branch builds its own images with the variables of its GitHub Environment: "development" (dev) and "production" (master).
# Every one of those values is public (it ships in the client bundle); none is a secret, and no secret is a build arg here.
# NEXT_PUBLIC_BASE_URL is required on a push (an image without it would point its upload and API calls at the wrong origin); the
# others are optional and build as empty when unset, exactly as the compose's `${VAR:-}` args do today. Runtime secrets (S3_*,
# the drive client secrets, SENDLY_API_KEY, OPENROUTER_API_KEY, ...) are not touched: they stay in the Dokploy compose env and
# reach the containers through the compose's list-form passthrough, unchanged.
#
# RUNNERS. upup is a PUBLIC repository. The gate and the image builds run on GitHub-hosted ubuntu-latest (they need Docker,
# which ubuntu-latest has). The deploy job must reach the registry host and Dokploy on the private network, so it runs on the
# org pool `ubuntu-devino`; the org runner group must allow this public repository (restricted to this workflow) before any
# switch is set to `mirror` or `all`, or that job waits in the queue. Pull requests never reach the deploy job.
name: Build and deploy the site compose to Dokploy
on:
    push:
        branches: [dev, master]
    pull_request:
        branches: [dev, master]
        # Only the changes that can alter how these images are built (or this workflow). Source changes are covered by main.yml
        # and e2e.yml, and every push to dev or master rebuilds all three images anyway.
        paths:
            - .github/workflows/dokploy-compose-build-deploy.yml
            - deploy/site/**
            - .dockerignore
            # The Dockerfiles install the whole workspace, so a dependency change can break the image build too.
            - package.json
            - pnpm-lock.yaml
            - pnpm-workspace.yaml
            - patches/**
    workflow_dispatch:
        inputs:
            dry_run:
                description: Plan against Dokploy and change nothing
                type: boolean
                default: false
            confirm_reconciled:
                description: First deploy after the compose was switched to a raw source (skips the stored-text check once)
                type: boolean
                default: false
            force:
                description: Deploy even when the stored text already pins these digests
                type: boolean
                default: false
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
    contents: read
    packages: write
    deployments: write
jobs:
    gate:
        # Decides, from repository-level variables alone (this job has no GitHub Environment), whether this run does anything.
        name: decide what this run does
        runs-on: ubuntu-latest
        timeout-minutes: 2
        permissions: {}
        outputs:
            run: ${{ steps.gate.outputs.run }}
            mode: ${{ steps.gate.outputs.mode }}
            envname: ${{ steps.gate.outputs.envname }}
        steps:
            - name: Read the kill switch of this branch
              id: gate
              env:
                  EVENT_NAME: ${{ github.event_name }}
                  REF: ${{ github.ref }}
                  SWITCH: ${{ github.ref == 'refs/heads/master' && vars.UPUP_DIGEST_PROD || (github.ref == 'refs/heads/dev' && vars.UPUP_DIGEST_DEV || '') }}
                  # A pull request from a fork or from Dependabot cannot push to ghcr: nothing runs for it.
                  PR_SAME_REPO: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]' }}
              run: |
                  value="$(printf '%s' "${SWITCH}" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')"
                  case "${value}" in
                    ''|mirror|all) ;;
                    *) echo "::error::UPUP_DIGEST_DEV / UPUP_DIGEST_PROD must be empty, mirror or all"; exit 1 ;;
                  esac
                  run=false; mode=off; envname=''
                  if [ "${EVENT_NAME}" = "pull_request" ]; then
                    [ "${PR_SAME_REPO}" = "true" ] && run=true
                    mode=build
                  else
                    case "${REF}" in
                      refs/heads/master) envname=production ;;
                      refs/heads/dev) envname=development ;;
                      *) echo "::error::push and manual runs are only for the dev and master branches"; exit 1 ;;
                    esac
                    if [ -n "${value}" ]; then run=true; mode="${value}"; else envname=''; fi
                  fi
                  echo "run=${run}" >> "${GITHUB_OUTPUT}"
                  echo "mode=${mode}" >> "${GITHUB_OUTPUT}"
                  echo "envname=${envname}" >> "${GITHUB_OUTPUT}"
                  echo "event=${EVENT_NAME} ref=${REF} run=${run} mode=${mode} environment=${envname:-none}"

    compose:
        needs: gate
        if: ${{ needs.gate.outputs.run == 'true' }}
        # A full commit sha of DevinoSolutions/.github (it also pins the deploy action the workflow uses). Move it deliberately.
        uses: DevinoSolutions/.github/.github/workflows/dokploy-compose.yml@4aea95ad1b9a642c05487187fd97099fb2855ca8
        with:
            # Every service of deploy/site/docker-compose.yml with a build block, with the args that block passes. Context "." is the
            # compose's `../..` (the repository root). A name is looked up in the branch's environment variables (then the
            # repository's); a trailing ? builds an empty arg when it is unset, which is what the compose's `${VAR:-}` does today.
            services: |
                [
                  { "name": "landing", "dockerfile": "deploy/site/Dockerfile.landing", "context": ".",
                    "build_args": ["NEXT_PUBLIC_BASE_URL",
                                   "NEXT_PUBLIC_GOOGLE_CLIENT_ID?", "NEXT_PUBLIC_GOOGLE_API_KEY?", "NEXT_PUBLIC_GOOGLE_APP_ID?",
                                   "NEXT_PUBLIC_ONEDRIVE_CLIENT_ID?", "NEXT_PUBLIC_DROPBOX_CLIENT_ID?", "NEXT_PUBLIC_BOX_CLIENT_ID?",
                                   "NEXT_PUBLIC_GOOGLE_ANALYTICS_ID?",
                                   "NEXT_PUBLIC_POSTHOG_KEY?", "NEXT_PUBLIC_POSTHOG_HOST?", "NEXT_PUBLIC_POSTHOG_DATASET?",
                                   "NEXT_PUBLIC_POSTHOG_E2E_TEST_PROJECT_HOST?", "NEXT_PUBLIC_POSTHOG_E2E_TEST_PROJECT_CAPTURE_TOKEN?",
                                   "NEXT_PUBLIC_MASTRA_BASE_URL?", "NEXT_PUBLIC_SENTRY_DSN?"] },
                  { "name": "mastra", "dockerfile": "deploy/site/Dockerfile.mastra", "context": "." },
                  { "name": "playground", "dockerfile": "deploy/site/Dockerfile.playground", "context": ".",
                    "build_args": ["NEXT_PUBLIC_BASE_URL",
                                   "NEXT_PUBLIC_GOOGLE_CLIENT_ID?", "NEXT_PUBLIC_GOOGLE_API_KEY?", "NEXT_PUBLIC_GOOGLE_APP_ID?",
                                   "NEXT_PUBLIC_ONEDRIVE_CLIENT_ID?", "NEXT_PUBLIC_DROPBOX_CLIENT_ID?", "NEXT_PUBLIC_BOX_CLIENT_ID?",
                                   "NEXT_PUBLIC_UPUP_UPLOAD_ENDPOINT?", "NEXT_PUBLIC_UPUP_USE_REAL_STORAGE?"] }
                ]
            compose-file: deploy/site/docker-compose.yml
            compose-id: ${{ github.ref == 'refs/heads/master' && vars.DOKPLOY_COMPOSE_ID_PROD || vars.DOKPLOY_COMPOSE_ID_DEV }}
            dokploy-url: ${{ vars.DOKPLOY_URL }} # repository variable
            dokploy-resolve: ${{ vars.DOKPLOY_CURL_RESOLVE }} # repository variable, host:port:address for curl --resolve
            github-environment: ${{ needs.gate.outputs.envname }}
            vars-json: ${{ toJSON(vars) }}
            deploy: ${{ github.event_name != 'pull_request' && needs.gate.outputs.mode == 'all' }}
            mirror-only: ${{ github.event_name != 'pull_request' && needs.gate.outputs.mode == 'mirror' }}
            dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true }}
            # Only a manual run can skip the stored-text check, and only for that run (no variable to forget to delete).
            confirm-reconciled: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm_reconciled == true }}
            force: ${{ github.event_name == 'workflow_dispatch' && inputs.force == true }}
            health-urls: ${{ github.ref == 'refs/heads/master' && 'https://useupup.com/' || 'https://dev.useupup.com/' }}
            build-runner: ubuntu-latest
            deploy-runner: ubuntu-devino
            # The Dokploy deploy queue is shared and can be long: wait for the result as long as the other adopters do.
            result-wait-seconds: '7200'
            job-budget-seconds: '8040'
        # An explicit map, not `secrets: inherit`: no image takes a build secret, so the shared workflow gets only the three it
        # needs to mirror and deploy (repository secrets), and none of the repository's other secrets reach a build.
        secrets:
            CI_REGISTRY_PASSWORD: ${{ secrets.CI_REGISTRY_PASSWORD }}
            CI_REGISTRY_TUNNEL_KEY: ${{ secrets.CI_REGISTRY_TUNNEL_KEY }}
            DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
