# Builds the three images of deploy/site/docker-compose.yml (landing, mastra, playground) ONCE per commit in GitHub Actions, copies them to
# our own registry by digest and has Dokploy deploy those digests. Dokploy never builds UpUp again. The work is done by the org's shared
# workflow DevinoSolutions/.github dokploy-compose.yml, pinned below to a full commit sha (T-14693). Setup guide and the per-compose
# cutover runbook: README of DevinoSolutions/.github, "Deploy a compose project to Dokploy with GitHub Actions". This replaces the
# earlier hook-based draft of this file (branch ci/build-once-deploy-by-digest): it keeps its idea (build once on GitHub-hosted runners,
# one image set per environment) and swaps the hook calls for the standard raw-compose deploy with a live "GitHub Actions" row.
#
# ONE FILE FOR EVERY BRANCH. The branch decides the target:
#   master          -> GitHub Environment `production`  -> Dokploy compose "UpupProdSite" (release key `upup`)
#   dev             -> GitHub Environment `development` -> Dokploy compose "UpupSite"     (release key `upup-dev`)
#   any other branch -> build only. Run it by hand (workflow_dispatch): it uses the `development` values and never deploys. GitHub
#                      refuses the run unless the `development` environment's deployment branch policy lists that branch, which is the
#                      point: those values are the dev deployment's.
# There is no pull_request trigger: the shared workflow pushes every image to ghcr, which a fork's read-only token cannot do, and this
# repository is public. The repository's own CI (main.yml, e2e.yml) covers pull requests; the image build of a push to dev or master that
# fails leaves Dokploy running the previous digest.
#
# RUNNERS. This repository is PUBLIC, and the organisation's self-hosted runner group refuses public repositories (a fork pull request
# could otherwise run code on our machines), so every job here runs on GitHub-hosted `ubuntu-latest`. The deploy job still has to reach
# the registry host and Dokploy, which are on the private network: see `deploy-runner` below.
#
# docker-compose.yml under deploy/site is NOT changed: it keeps its `build:` blocks, so `docker compose -f deploy/site/docker-compose.yml
# up --build` still works. The shared workflow renders a copy with `build:` replaced by `image: <mirror>@sha256:<digest>` at deploy time
# and hands that to Dokploy as a RAW compose. A raw compose has no checkout, so the compose file must not bind-mount repository files (it
# does not). Runtime secrets stay in the Dokploy Environment tab; nothing secret is a build argument.
#
# DEV AND PROD IMAGES DIFFER. landing and playground inline their NEXT_PUBLIC_* values at build time, so each branch builds its own images
# with the VARIABLES of its GitHub Environment, `development` (dev) or `production` (master). They are public client values (they ship in
# the browser bundle), which is why they are variables and not secrets. NEXT_PUBLIC_BASE_URL is required; the others are optional and
# build as an empty argument when unset, exactly as the compose file's `${VAR:-}` arguments do. WHEN A NEXT_PUBLIC_* VALUE CHANGES IN THE
# DOKPLOY ENVIRONMENT TAB, UPDATE THE SAME VARIABLE OF THE MATCHING GITHUB ENVIRONMENT TOO, or the next build keeps the old value.
#
# KILL SWITCH. The repository variable UPUP_DIGEST_SERVICES lists, comma separated and without spaces, what this repo may deploy: `dev`
# (the dev branch) and `prod` (the master branch). EMPTY = the workflow only BUILDS (push, dispatch) and pushes to ghcr; nothing is
# mirrored and Dokploy is not contacted. Clearing the variable stops every automatic deploy.
#
# An explicit `secrets:` map (not `secrets: inherit`) is deliberate: this repo holds repository secrets with short values
# (POSTHOG_E2E_TEST_PROJECT_ID), and GitHub masks every secret value it knows inside a job's outputs, which turns "sha256:..." into a
# masked output and drops the digests.
#
# Repository variables: DOKPLOY_URL, DOKPLOY_CURL_RESOLVE, DOKPLOY_COMPOSE_ID_DEV, DOKPLOY_COMPOSE_ID_PROD, UPUP_DIGEST_SERVICES.
# Environment variables (production and development, each): the NEXT_PUBLIC_* build values.
# Environment secrets (production and development, each): CI_REGISTRY_PASSWORD, CI_REGISTRY_TUNNEL_KEY, DOKPLOY_API_KEY.
#
# Manual run (workflow_dispatch): `mirror_only` builds, mirrors the images to our registry and renders the compose without contacting
# Dokploy (the proof run of a new setup); `dry_run` plans against Dokploy and changes nothing; `confirm_reconciled` is for the FIRST deploy
# after the Dokploy compose was switched to a raw compose (it skips the check that a stored compose carries the workflow's header) and for
# nothing else. A dispatch that is neither dry nor mirror-only deploys only on dev or master and only while the kill switch names the branch.
#
# BUILD ONCE. Every run of a sha builds each image through the shared workflow's registry layer cache (ghcr.io/devinosolutions/upup/cache),
# so a second run of the same sha re-resolves the same cached layers instead of compiling again, and the deploy step skips a compose whose
# rendered text is already the stored one.
name: Build and deploy the site to Dokploy
on:
    push:
        branches: [dev, master, ci/gha-build-once-by-digest] # PROOF-ONLY entry, removed again # dev deploys the dev compose, master the production compose
    workflow_dispatch:
        inputs:
            mirror_only:
                description: Build, mirror to our registry and render the compose; do not contact Dokploy
                type: boolean
                default: false
            dry_run:
                description: Plan against Dokploy and change nothing
                type: boolean
                default: false
            confirm_reconciled:
                description: First deploy after the switch to a raw compose (see the header of the workflow)
                type: boolean
                default: false
concurrency:
    # One run per ref; a newer push waits behind a running deploy and replaces an older waiting run. Never cancel a run in progress: it may be
    # in the middle of a deploy.
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: false
permissions:
    contents: read
    packages: write
    deployments: write
jobs:
    compose:
        # A dispatch may run on any branch (build only unless it is dev or master); a push only reaches this job on dev or master.
        # A full commit sha of DevinoSolutions/.github (it also pins the deploy action the workflow uses). Move it deliberately.
        uses: DevinoSolutions/.github/.github/workflows/dokploy-compose.yml@d0d316426e7d1328ae65c83924a33f59b92f4253
        with:
            compose-file: deploy/site/docker-compose.yml
            # One object per service of the compose file that has a `build:` block. `dockerfile` is relative to the repository root and
            # `context` is what the compose file says (`../..` from deploy/site = the root). A trailing `?` makes an argument optional
            # (an empty argument when the environment does not define it), as the compose file's `${VAR:-}` does.
            services: |
                [
                  { "name": "landing", "dockerfile": "deploy/site/Dockerfile.landing", "context": ".",
                    "build_args": ["NEXT_PUBLIC_BASE_URL", "NEXT_PUBLIC_GOOGLE_CLIENT_ID?", "NEXT_PUBLIC_GOOGLE_API_KEY?",
                      "NEXT_PUBLIC_GOOGLE_APP_ID?", "NEXT_PUBLIC_ONEDRIVE_CLIENT_ID?", "NEXT_PUBLIC_DROPBOX_CLIENT_ID?",
                      "NEXT_PUBLIC_BOX_CLIENT_ID?", "NEXT_PUBLIC_GOOGLE_ANALYTICS_ID?", "NEXT_PUBLIC_POSTHOG_KEY?",
                      "NEXT_PUBLIC_POSTHOG_HOST?", "NEXT_PUBLIC_POSTHOG_DATASET?", "NEXT_PUBLIC_POSTHOG_E2E_TEST_PROJECT_HOST?",
                      "NEXT_PUBLIC_POSTHOG_E2E_TEST_PROJECT_CAPTURE_TOKEN?", "NEXT_PUBLIC_MASTRA_BASE_URL?", "NEXT_PUBLIC_SENTRY_DSN?"] },
                  { "name": "mastra", "dockerfile": "deploy/site/Dockerfile.mastra", "context": "." },
                  { "name": "playground", "dockerfile": "deploy/site/Dockerfile.playground", "context": ".",
                    "build_args": ["NEXT_PUBLIC_BASE_URL", "NEXT_PUBLIC_GOOGLE_CLIENT_ID?", "NEXT_PUBLIC_GOOGLE_API_KEY?",
                      "NEXT_PUBLIC_GOOGLE_APP_ID?", "NEXT_PUBLIC_ONEDRIVE_CLIENT_ID?", "NEXT_PUBLIC_DROPBOX_CLIENT_ID?",
                      "NEXT_PUBLIC_BOX_CLIENT_ID?", "NEXT_PUBLIC_UPUP_UPLOAD_ENDPOINT?", "NEXT_PUBLIC_UPUP_USE_REAL_STORAGE?"] }
                ]
            # fromJSON(toJSON(..)): an empty or missing production id stays empty (the shared workflow then refuses to deploy) instead of
            # falling through to the dev compose.
            compose-id: ${{ fromJSON(github.ref == 'refs/heads/master' && toJSON(vars.DOKPLOY_COMPOSE_ID_PROD) || toJSON(vars.DOKPLOY_COMPOSE_ID_DEV)) }}
            dokploy-url: ${{ vars.DOKPLOY_URL }}
            dokploy-resolve: ${{ vars.DOKPLOY_CURL_RESOLVE }} # host:port:address for curl --resolve (the tailnet name does not resolve publicly)
            github-environment: ${{ github.ref == 'refs/heads/master' && 'production' || 'development' }}
            release-key: ${{ github.ref == 'refs/heads/master' && 'upup' || 'upup-dev' }}
            deploy: ${{ (github.ref == 'refs/heads/master' && contains(format(',{0},', vars.UPUP_DIGEST_SERVICES), ',prod,')) || (github.ref == 'refs/heads/dev' && contains(format(',{0},', vars.UPUP_DIGEST_SERVICES), ',dev,')) }}
            mirror-only: ${{ github.event_name == 'workflow_dispatch' && inputs.mirror_only }}
            dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
            confirm-reconciled: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm_reconciled }}
            # GitHub-hosted runners (see RUNNERS above).
            build-runner: ubuntu-latest
            deploy-runner: ubuntu-latest
        secrets:
            CI_REGISTRY_PASSWORD: ${{ secrets.CI_REGISTRY_PASSWORD }}
            CI_REGISTRY_TUNNEL_KEY: ${{ secrets.CI_REGISTRY_TUNNEL_KEY }}
            DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
