# Builds the three images of deploy/site/docker-compose.yml (landing, mastra, playground) ONCE per commit on GitHub-hosted runners,
# pushes them to GHCR by digest and publishes a Dokploy release (T-14693). Dokploy never builds UpUp from source: it polls GitHub
# (outbound only), reads the release, checks it against this run and deploys the digests. This file holds no Dokploy address and no
# Dokploy API key. The only step that talks to Dokploy's contract is the public action DevinoSolutions/dokploy-release.
# It builds on the earlier branch ci/build-once-deploy-by-digest (hook-based draft, bbd5d0f3): same idea (build once on hosted runners,
# one image set per environment), but the hook calls are gone because UpUp is public and cannot reach the private network.
#
# ONE FILE FOR EVERY BRANCH. The branch decides the target:
#   master          -> GitHub Environment `production`  -> Dokploy compose "UpupProdSite"  (release key `upup`)
#   dev             -> GitHub Environment `development` -> Dokploy compose "UpupSite"      (release key `upup-dev`)
#   pull request    -> the `check` job: the three images are built with push: false and a read-only token (a broken Dockerfile fails
#                      on the PR), nothing is pushed or released. Same-repository pull requests only: a fork's never gets a build here.
# Any other branch has no trigger. The repository's own CI (main.yml, e2e.yml) covers the rest of a pull request.
#
# WHY HOSTED RUNNERS. UpUp is PUBLIC; the organisation's self-hosted runner group refuses public repositories. Nothing here needs the
# private network: the images go to GHCR (public packages, so Dokploy pulls without a credential) and the release is a GitHub
# Deployment plus a manifest line in the release job's log that Dokploy reads itself.
#
# THE IMAGES. ghcr.io/devinosolutions/upup/landing, upup/mastra and upup/playground (the repository name is the namespace Dokploy accepts: ghcr.io/<owner>/<repo>/), tagged <prod|dev>-<first 12 of the sha>. landing and
# playground inline their NEXT_PUBLIC_* values at build time, so dev and prod are DIFFERENT images of the same commit. The values are
# public client values (they ship in the browser bundle), which is why they are repository VARIABLES and not secrets: PROD_NEXT_PUBLIC_*
# for master and DEV_NEXT_PUBLIC_* for everything else. They are repository variables, not GitHub Environment variables, because a job
# that names an environment creates a GitHub Deployment (three per run for the build legs). NEXT_PUBLIC_BASE_URL is required, the others
# build as an empty argument when unset (the compose file's `${VAR:-}`). WHEN A NEXT_PUBLIC_* VALUE CHANGES IN THE DOKPLOY ENVIRONMENT TAB,
# CHANGE THE SAME PROD_/DEV_ VARIABLE TOO, or the next build keeps the old value. Runtime secrets (S3_*, drive client secrets,
# OPENROUTER_API_KEY, ...) never appear here: they stay in the Dokploy Environment tab. The packages must be PUBLIC (Settings of each
# package on GitHub).
#
# THE RELEASE. After the three images are pushed and verified, the `release` job publishes ONE release for the branch's Dokploy compose:
# the key is `upup` (master) or `upup-dev` (dev), the compose services are landing, mastra and playground, and each image is taken from
# a job output of THIS run (a tag is refused). The release manifest is read from the release job's log (`upload-artifact: false`: this
# repository's policy is that workflows never use actions/upload-artifact). Dokploy deploys it only once a Connect exists for that key
# (Dokploy Settings, GitHub Actions); until then the release is published and ignored, exactly like a dry run. Only the release job names
# an environment: production (master only) or development (dev only), each with a deployment branch policy that Dokploy re-reads at
# every acceptance.
#
# Layer cache: GitHub's own (type=gha, mode=min to stay small in the repository's 10 GB cache quota, one scope per service). A branch
# cannot write the default branch's cache scope; a pull request only reads it.
name: Dokploy
on:
    push:
        branches: [dev, master]
    pull_request:
        branches: [dev, master]
    workflow_dispatch:
concurrency:
    # One run per ref; a newer push waits behind the running one. Never cancel a run that may be publishing a release; a superseded
    # pull request check is cancelled.
    group: dokploy-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
    contents: read
jobs:
    build:
        name: build ${{ matrix.service }}
        # dev and master only (push, or a manual run on one of them). The pull request check is the `check` job below.
        if: ${{ github.ref == 'refs/heads/master' || github.ref == 'refs/heads/dev' }}
        runs-on: ubuntu-latest
        timeout-minutes: 60
        # No `environment:` here on purpose: it would create a GitHub Deployment per build leg.
        permissions:
            contents: read
            packages: write
        strategy:
            fail-fast: false
            matrix:
                include:
                    # build_args: the exact `args:` of that service's build block in deploy/site/docker-compose.yml.
                    - service: landing
                      dockerfile: deploy/site/Dockerfile.landing
                      build_args: >-
                          NEXT_PUBLIC_BASE_URL NEXT_PUBLIC_GOOGLE_CLIENT_ID NEXT_PUBLIC_GOOGLE_API_KEY NEXT_PUBLIC_GOOGLE_APP_ID
                          NEXT_PUBLIC_ONEDRIVE_CLIENT_ID NEXT_PUBLIC_DROPBOX_CLIENT_ID NEXT_PUBLIC_BOX_CLIENT_ID
                          NEXT_PUBLIC_GOOGLE_ANALYTICS_ID NEXT_PUBLIC_POSTHOG_KEY NEXT_PUBLIC_POSTHOG_HOST NEXT_PUBLIC_POSTHOG_DATASET
                          NEXT_PUBLIC_POSTHOG_E2E_TEST_PROJECT_HOST NEXT_PUBLIC_POSTHOG_E2E_TEST_PROJECT_CAPTURE_TOKEN
                          NEXT_PUBLIC_MASTRA_BASE_URL NEXT_PUBLIC_SENTRY_DSN
                    - service: mastra
                      dockerfile: deploy/site/Dockerfile.mastra
                      build_args: ''
                    - service: playground
                      dockerfile: deploy/site/Dockerfile.playground
                      build_args: >-
                          NEXT_PUBLIC_BASE_URL NEXT_PUBLIC_GOOGLE_CLIENT_ID NEXT_PUBLIC_GOOGLE_API_KEY NEXT_PUBLIC_GOOGLE_APP_ID
                          NEXT_PUBLIC_ONEDRIVE_CLIENT_ID NEXT_PUBLIC_DROPBOX_CLIENT_ID NEXT_PUBLIC_BOX_CLIENT_ID
                          NEXT_PUBLIC_UPUP_UPLOAD_ENDPOINT NEXT_PUBLIC_UPUP_USE_REAL_STORAGE
        # Named per service (a leg sets only its own), read back by the release job.
        outputs:
            digest_landing: ${{ steps.verify.outputs.digest_landing }}
            digest_mastra: ${{ steps.verify.outputs.digest_mastra }}
            digest_playground: ${{ steps.verify.outputs.digest_playground }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - name: Collect the build arguments
              id: args
              env:
                  NAMES: ${{ matrix.build_args }}
                  REF: ${{ github.ref }}
                  # Repository variables only (PROD_* / DEV_*); the script below picks the set of the branch. Public client values, not secrets.
                  VARS_JSON: ${{ toJSON(vars) }}
              run: |
                  set -euo pipefail
                  prefix=DEV_
                  [ "${REF}" != refs/heads/master ] || prefix=PROD_
                  set_names=()
                  {
                    echo 'build-args<<EOF_BUILD_ARGS'
                    for name in ${NAMES}; do
                      value="$(printf '%s' "${VARS_JSON}" | jq -r --arg key "${prefix}${name}" '.[$key] // ""')"
                      case "${value}" in *$'\n'*|*$'\r'*) echo "::error::variable ${prefix}${name} is not a single line" >&2; exit 1 ;; esac
                      if [ "${name}" = "NEXT_PUBLIC_BASE_URL" ] && [ -z "${value}" ]; then
                        echo "::error::the repository variable ${prefix}NEXT_PUBLIC_BASE_URL is not defined" >&2; exit 1
                      fi
                      [ -z "${value}" ] || set_names+=("${name}")
                      echo "${name}=${value}"
                    done
                    echo 'EOF_BUILD_ARGS'
                  } >> "${GITHUB_OUTPUT}"
                  echo "build args set from ${prefix}* variables (names only): ${set_names[*]:-none}"
                  case "${REF}" in
                    refs/heads/master) tag=prod ;;
                    refs/heads/dev) tag=dev ;;
                    *) tag=check ;;
                  esac
                  echo "tag=${tag}-${GITHUB_SHA:0:12}" >> "${GITHUB_OUTPUT}"
            - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
            - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            - name: Build once and push ${{ matrix.service }}
              id: build
              uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
              env:
                  # The action would upload a build-record artifact per build: switch that off (this repository's workflows never upload artifacts).
                  DOCKER_BUILD_RECORD_UPLOAD: false
                  DOCKER_BUILD_SUMMARY: false
              with:
                  context: .
                  file: ${{ matrix.dockerfile }}
                  platforms: linux/amd64
                  push: true
                  tags: ghcr.io/devinosolutions/upup/${{ matrix.service }}:${{ steps.args.outputs.tag }}
                  build-args: ${{ steps.args.outputs.build-args }}
                  provenance: false
                  sbom: false
                  labels: |
                      org.opencontainers.image.source=https://github.com/${{ github.repository }}
                      org.opencontainers.image.revision=${{ github.sha }}
                  cache-from: type=gha,scope=upup-${{ matrix.service }}
                  cache-to: type=gha,mode=min,scope=upup-${{ matrix.service }}
            - name: Check that GHCR serves the pushed digest
              id: verify
              env:
                  SERVICE: ${{ matrix.service }}
                  DIGEST: ${{ steps.build.outputs.digest }}
              run: |
                  set -euo pipefail
                  [[ "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::no image digest from the build"; exit 1; }
                  ref="ghcr.io/devinosolutions/upup/${SERVICE}@${DIGEST}"
                  raw=''
                  for attempt in 1 2 3; do
                    if docker buildx imagetools inspect --raw "${ref}" > "${RUNNER_TEMP}/manifest.raw"; then
                      raw="sha256:$(sha256sum "${RUNNER_TEMP}/manifest.raw" | cut -d' ' -f1)"; break
                    fi
                    sleep $((attempt * 5))
                  done
                  [ "${raw}" = "${DIGEST}" ] || { echo "::error::GHCR does not serve the pushed manifest of ${SERVICE} by its digest"; exit 1; }
                  # Dokploy pulls without a credential: prove the package is public with an anonymous token and a manifest HEAD.
                  code=000
                  for attempt in 1 2 3; do
                    token="$(curl -fsS "https://ghcr.io/token?scope=repository:devinosolutions/upup/${SERVICE}:pull" | jq -r '.token // empty' || true)"
                    code="$(curl -s -o /dev/null -w '%{http_code}' -I -H "Authorization: Bearer ${token}" -H 'Accept: application/vnd.oci.image.manifest.v1+json, application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.v2+json' "https://ghcr.io/v2/devinosolutions/upup/${SERVICE}/manifests/${DIGEST}" || true)"
                    [ "${code}" = 200 ] && break
                    sleep $((attempt * 5))
                  done
                  [ "${code}" = 200 ] || { echo "::error::ghcr.io/devinosolutions/upup/${SERVICE} is not pullable anonymously (HTTP ${code}); make the package public"; exit 1; }
                  echo "digest_${SERVICE}=${DIGEST}" >> "${GITHUB_OUTPUT}"
                  echo "- \`${ref}\`" >> "${GITHUB_STEP_SUMMARY}"

    check:
        name: check ${{ matrix.service }}
        # Pull request check: same-repository pull requests only, read-only token (no packages: write, no registry login, nothing pushed).
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        runs-on: ubuntu-latest
        timeout-minutes: 60
        permissions:
            contents: read
        strategy:
            fail-fast: false
            matrix:
                include:
                    # Same build_args as the build job above.
                    - service: landing
                      dockerfile: deploy/site/Dockerfile.landing
                      build_args: >-
                          NEXT_PUBLIC_BASE_URL NEXT_PUBLIC_GOOGLE_CLIENT_ID NEXT_PUBLIC_GOOGLE_API_KEY NEXT_PUBLIC_GOOGLE_APP_ID
                          NEXT_PUBLIC_ONEDRIVE_CLIENT_ID NEXT_PUBLIC_DROPBOX_CLIENT_ID NEXT_PUBLIC_BOX_CLIENT_ID
                          NEXT_PUBLIC_GOOGLE_ANALYTICS_ID NEXT_PUBLIC_POSTHOG_KEY NEXT_PUBLIC_POSTHOG_HOST NEXT_PUBLIC_POSTHOG_DATASET
                          NEXT_PUBLIC_POSTHOG_E2E_TEST_PROJECT_HOST NEXT_PUBLIC_POSTHOG_E2E_TEST_PROJECT_CAPTURE_TOKEN
                          NEXT_PUBLIC_MASTRA_BASE_URL NEXT_PUBLIC_SENTRY_DSN
                    - service: mastra
                      dockerfile: deploy/site/Dockerfile.mastra
                      build_args: ''
                    - service: playground
                      dockerfile: deploy/site/Dockerfile.playground
                      build_args: >-
                          NEXT_PUBLIC_BASE_URL NEXT_PUBLIC_GOOGLE_CLIENT_ID NEXT_PUBLIC_GOOGLE_API_KEY NEXT_PUBLIC_GOOGLE_APP_ID
                          NEXT_PUBLIC_ONEDRIVE_CLIENT_ID NEXT_PUBLIC_DROPBOX_CLIENT_ID NEXT_PUBLIC_BOX_CLIENT_ID
                          NEXT_PUBLIC_UPUP_UPLOAD_ENDPOINT NEXT_PUBLIC_UPUP_USE_REAL_STORAGE
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - name: Collect the build arguments
              id: args
              env:
                  NAMES: ${{ matrix.build_args }}
                  # The DEV_* repository variables (public client values). The values do not matter for the check, only that the image builds.
                  VARS_JSON: ${{ toJSON(vars) }}
              run: |
                  set -euo pipefail
                  {
                    echo 'build-args<<EOF_BUILD_ARGS'
                    for name in ${NAMES}; do
                      value="$(printf '%s' "${VARS_JSON}" | jq -r --arg key "DEV_${name}" '.[$key] // ""')"
                      case "${value}" in *$'\n'*|*$'\r'*) echo "::error::variable DEV_${name} is not a single line" >&2; exit 1 ;; esac
                      if [ "${name}" = "NEXT_PUBLIC_BASE_URL" ] && [ -z "${value}" ]; then
                        echo "::error::the repository variable DEV_NEXT_PUBLIC_BASE_URL is not defined" >&2; exit 1
                      fi
                      echo "${name}=${value}"
                    done
                    echo 'EOF_BUILD_ARGS'
                  } >> "${GITHUB_OUTPUT}"
            - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
            - name: Build ${{ matrix.service }} without pushing
              uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
              env:
                  DOCKER_BUILD_RECORD_UPLOAD: false
                  DOCKER_BUILD_SUMMARY: false
              with:
                  context: .
                  file: ${{ matrix.dockerfile }}
                  platforms: linux/amd64
                  push: false
                  build-args: ${{ steps.args.outputs.build-args }}
                  provenance: false
                  sbom: false
                  cache-from: type=gha,scope=upup-${{ matrix.service }}

    release:
        name: publish the Dokploy release
        needs: build
        # dev and master only (push or a manual run).
        if: ${{ github.ref == 'refs/heads/master' || github.ref == 'refs/heads/dev' }}
        runs-on: ubuntu-latest
        timeout-minutes: 10
        # The only job with an environment: its deployment branch policy gates the release and Dokploy re-reads that policy.
        environment: ${{ github.ref == 'refs/heads/master' && 'production' || 'development' }}
        permissions:
            contents: read
            deployments: write
        steps:
            - name: Compose the image list
              id: images
              env:
                  DIGEST_LANDING: ${{ needs.build.outputs.digest_landing }}
                  DIGEST_MASTRA: ${{ needs.build.outputs.digest_mastra }}
                  DIGEST_PLAYGROUND: ${{ needs.build.outputs.digest_playground }}
                  REF: ${{ github.ref }}
              run: |
                  set -euo pipefail
                  key=upup-dev; [ "${REF}" != refs/heads/master ] || key=upup
                  for svc in LANDING MASTRA PLAYGROUND; do
                    var="DIGEST_${svc}"
                    [[ "${!var}" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::no digest for ${svc,,} from the build job"; exit 1; }
                  done
                  {
                    echo "key=${key}"
                    echo 'lines<<EOF_IMAGES'
                    echo "${key}/landing=ghcr.io/devinosolutions/upup/landing@${DIGEST_LANDING}"
                    echo "${key}/mastra=ghcr.io/devinosolutions/upup/mastra@${DIGEST_MASTRA}"
                    echo "${key}/playground=ghcr.io/devinosolutions/upup/playground@${DIGEST_PLAYGROUND}"
                    echo 'EOF_IMAGES'
                  } >> "${GITHUB_OUTPUT}"
            - uses: DevinoSolutions/dokploy-release@38d84fb3f3e72d766b4067579d2d9e6bca93d5cb # v2.0.0
              with:
                  service: ${{ steps.images.outputs.key }}
                  environment: ${{ github.ref == 'refs/heads/master' && 'production' || 'development' }}
                  delivery: pull
                  # Policy: no actions/upload-artifact in this repository. Dokploy reads the manifest line from this job's log.
                  upload-artifact: 'false'
                  existing-image: ${{ steps.images.outputs.lines }}
                  compose: deploy/site/docker-compose.yml
