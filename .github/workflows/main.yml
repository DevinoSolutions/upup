name: CI

permissions:
    id-token: write
    contents: read
on:
    pull_request:
        branches: [master, dev]
    workflow_dispatch:

# A newer push to the same PR cancels the superseded run (T-5373). Safe for the
# rollups: cancelling the workflow cancels Status-Check too, and Status-Check
# (if: always()) fails on any need whose result is not 'success' -- a cancelled
# or skipped need can never read as green. The new head's run supplies the
# check. workflow_dispatch runs group by ref. (Verified on PR #612.)
concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

# Actions are pinned to full commit SHAs (F-792) to match docker-compose's
# digest-pinning posture; the trailing comment records the human version.
# Dependabot's github-actions group updates the SHA pins weekly.
# pnpm is bootstrapped via pnpm/action-setup (reads packageManager from
# package.json) + setup-node cache:pnpm — one mechanism across all workflows
# (F-787). Do not reintroduce the hardcoded `npm install -g pnpm@x` bootstrap.

jobs:
    # Docs-only PRs (every changed file is under docs/ or a root-level *.md)
    # skip the heavy gates below. A workflow-level `paths-ignore` is NOT used
    # on purpose: a skipped workflow reports no check at all, which would leave
    # the REQUIRED `Status Check` pending forever. Here the workflow always
    # runs, this job decides, and Status-Check (if: always()) still reports --
    # green on a docs-only diff, red if this job itself fails. Fail-open: any
    # doubt (dispatch, empty or unreadable diff, a crashing classifier) reports
    # code=true. The docs-only definition lives in ONE place,
    # scripts/ci/docs-only.mjs, shared with the LIGHT_DOC tier of
    # scripts/ci/resolve-affected-tests.mjs (e2e.yml); do not inline a regex here.
    Changes:
        name: Classify changes
        runs-on: ubuntu-latest
        timeout-minutes: 10
        outputs:
            code: ${{ steps.classify.outputs.code }}
        steps:
            - name: Checkout the repository (full history for merge-base diff)
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0

            - name: Classify the diff
              id: classify
              env:
                  EVENT: ${{ github.event_name }}
                  BASE: ${{ github.event.pull_request.base.sha }}
                  HEAD: ${{ github.event.pull_request.head.sha }}
              run: |
                  code=true
                  if [ "$EVENT" = "pull_request" ]; then
                    if files=$(git diff --no-renames --name-only "$BASE...$HEAD") && [ -n "$files" ]; then
                      if printf '%s\n' "$files" | node scripts/ci/docs-only.mjs; then
                        code=false
                      fi
                    fi
                  fi
                  echo "code=$code" >> "$GITHUB_OUTPUT"
                  echo "code=$code"

    Prettier-check:
        name: Prettier Check
        runs-on: ubuntu-latest
        timeout-minutes: 15
        needs: [Changes]
        if: needs.Changes.outputs.code == 'true'
        steps:
            - name: Checkout the repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup pnpm
              uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

            - name: Setup Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: '.nvmrc'
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Prettier Check
              run: pnpm run prettier-check

    Test:
        name: Run Tests and Coverage
        runs-on: ubuntu-latest
        timeout-minutes: 20
        needs: [Prettier-check]
        steps:
            - name: Checkout repo
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup pnpm
              uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

            - name: Setup Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: '.nvmrc'
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Test-quality guard # committed .only, silent skips, vague names, unjustified sleeps, integration-layer mocks, regen-guard presence
              run: pnpm run test:quality

            - name: Script self-tests (quality guard, affected resolver, tarball lib)
              run: pnpm run test:scripts

            # Sitemap <lastmod> snapshot gate (T-5788): every sitemapped page has
            # an entry in apps/landing/src/generated/page-lastmod.json, none is
            # orphaned, every mapped source exists, dates are real and not in
            # the future. This checkout is shallow, so the freshness comparison
            # against git history is skipped here and says so; the pre-commit
            # hook regenerates the snapshot and runs the full check locally.
            - name: Page-lastmod snapshot check
              run: pnpm run seo:lastmod:check

            # ONE run of every unit suite (T-5373; previously `pnpm run test` then
            # `pnpm run test:coverage` ran the 9 publishable suites twice).
            # test:coverage = the 9 publishable packages' suites WITH their v8
            # ratchets (F-162 / F-503; turbo --continue so one package cannot mask
            # the rest, F-790: routed through turbo so preact/vanilla see fresh
            # dist). The second step runs the remaining workspace suites that have a
            # `test` script but no coverage config (turbo --filter excludes the 9;
            # their dists are already on disk from the step above). Together
            # they cover every package `pnpm run test` did, each exactly once.
            # This relies on turbo.json's `test` task depending only on `^build`:
            # a `^test` dependency would pull the 9 suites back into this step.
            - name: Unit suites + coverage floors (9 publishable packages)
              run: pnpm run test:coverage

            - name: Unit suites (private packages and apps) # F-163 / F-502
              if: ${{ !cancelled() }}
              run: pnpm exec turbo run test --continue --filter='!@useupup/core' --filter='!@useupup/server' --filter='!@useupup/react' --filter='!@useupup/vue' --filter='!@useupup/svelte' --filter='!@useupup/vanilla' --filter='!@useupup/angular' --filter='!@useupup/preact' --filter='!@useupup/next'

            - name: Env schema drift
              run: pnpm run env:check

            - name: Retired-vocabulary census # naming sweeps must land in EVERY layer (identifiers, DOM strings, fixtures) — see scripts/check-retired-vocab.mjs
              run: pnpm run vocab:check

            # Coverage goes to the run summary, not an artifact: the org artifact
            # quota was exhausted in October 2026 and a blocked upload FAILS its
            # step. Reads the json-summary each package's vitest config writes
            # under coverage/<pkg>/; a missing or unparsable file is skipped and
            # the step can never fail.
            - name: Coverage summary
              if: ${{ !cancelled() }}
              run: |
                  {
                    echo "### Unit coverage (v8: statements / branches / functions / lines)"
                    echo
                    node -e '
                      const fs = require("fs");
                      let rows = 0;
                      if (fs.existsSync("coverage")) {
                        for (const d of fs.readdirSync("coverage").sort()) {
                          try {
                            const t = JSON.parse(fs.readFileSync("coverage/" + d + "/coverage-summary.json", "utf8")).total;
                            const f = (k) => t[k].pct + "%";
                            console.log("- `" + d + "`: " + f("statements") + " / " + f("branches") + " / " + f("functions") + " / " + f("lines"));
                            rows++;
                          } catch {}
                        }
                      }
                      if (!rows) console.log("No coverage-summary.json files found.");
                    '
                  } >> "$GITHUB_STEP_SUMMARY" || true

    Build:
        name: Build, size and snippet typecheck
        runs-on: ubuntu-latest
        timeout-minutes: 30
        needs: [Prettier-check]
        steps:
            - name: Checkout repo
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup pnpm
              uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

            - name: Setup Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: '.nvmrc'
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build
              run: pnpm run build
              env:
                  MINIO_ROOT_USER: upupadmin
                  MINIO_ROOT_PASSWORD: upupadmin123
                  UPUP_UPLOAD_TOKEN_SECRET: upup-e2e-upload-token-secret-dev-only
                  UPUP_E2E_BUCKET: upup-e2e
                  UPUP_E2E_REGION: us-east-1
                  UPUP_E2E_ENDPOINT: http://localhost:9100

            # Size budgets and the doc-snippet typecheck both read the dist this
            # job just built, so they run here rather than in jobs that would need
            # the dist handed over as an artifact (artifact uploads are blocked
            # org-wide while the quota is exhausted).
            - name: Size limit
              run: pnpm run size

            - name: Snippet typecheck (needs built dist)
              run: pnpm run docs:snippets:check

    Typecheck:
        name: Typecheck project
        runs-on: ubuntu-latest
        timeout-minutes: 15
        needs: [Prettier-check]
        steps:
            - name: Checkout repo
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup pnpm
              uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

            - name: Setup Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: '.nvmrc'
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Typecheck
              run: pnpm run typecheck

    Dependency-Audit:
        name: Dependency audit (packages/*, production scope)
        runs-on: ubuntu-latest
        timeout-minutes: 30
        needs: [Prettier-check]
        steps:
            - name: Checkout repo
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup pnpm
              uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

            - name: Setup Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: '.nvmrc'
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Prod dependency audit (publishable packages, fail on high+)
              run: pnpm run audit:prod

    Lint:
        name: Lint
        runs-on: ubuntu-latest
        timeout-minutes: 15
        needs: [Prettier-check]
        steps:
            - name: Checkout repo
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup pnpm
              uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

            - name: Setup Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: '.nvmrc'
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Lint
              run: pnpm run lint

    Oxlint:
        name: Oxlint (fast lint)
        runs-on: ubuntu-latest
        timeout-minutes: 15
        needs: [Changes]
        if: needs.Changes.outputs.code == 'true'
        steps:
            - name: Checkout repo
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup pnpm
              uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

            - name: Setup Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: '.nvmrc'
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Oxlint
              run: pnpm run lint:ox

    Knip:
        name: Knip (dead code)
        runs-on: ubuntu-latest
        timeout-minutes: 15
        needs: [Prettier-check]
        steps:
            - name: Checkout repo
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup pnpm
              uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

            - name: Setup Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: '.nvmrc'
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Knip
              run: pnpm run knip

    Docs-Gate:
        name: Docs sync gate
        runs-on: ubuntu-latest
        timeout-minutes: 30
        needs: [Prettier-check]
        steps:
            - name: Checkout repo
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup pnpm
              uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

            - name: Setup Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: '.nvmrc'
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            # Cheap checks first — no build needed (docs links, api<->docs drift,
            # per-topic snippet coverage).
            - name: Docs link integrity
              run: pnpm run docs:links:check

            - name: API<->docs sync
              run: pnpm run docs:api-sync:check

            - name: Snippet coverage
              run: pnpm run docs:snippets:coverage

    Status-Check:
        name: Status Check
        runs-on: ubuntu-latest
        timeout-minutes: 15
        needs:
            [
                Changes,
                Prettier-check,
                Oxlint,
                Test,
                Build,
                Typecheck,
                Dependency-Audit,
                Lint,
                Knip,
                Docs-Gate,
            ]
        if: always()
        steps:
            # Docs-only PRs (Changes.code == 'false') skip every gate, so a
            # 'skipped' need is acceptable ONLY then. Otherwise -- and always for
            # Changes itself -- anything but 'success' (cancelled, failed,
            # skipped) is red, exactly as before.
            - name: Check status
              env:
                  CODE: ${{ needs.Changes.outputs.code }}
                  RESULTS: >-
                      ${{ needs.Prettier-check.result }}
                      ${{ needs.Oxlint.result }}
                      ${{ needs.Test.result }}
                      ${{ needs.Build.result }}
                      ${{ needs.Typecheck.result }}
                      ${{ needs.Dependency-Audit.result }}
                      ${{ needs.Lint.result }}
                      ${{ needs.Knip.result }}
                      ${{ needs.Docs-Gate.result }}
              run: |
                  if [ "${{ needs.Changes.result }}" != "success" ]; then
                    echo "Changes classification did not succeed"
                    exit 1
                  fi
                  ok="success"
                  if [ "$CODE" = "false" ]; then ok="success skipped"; fi
                  for r in $RESULTS; do
                    case " $ok " in
                      *" $r "*) ;;
                      *) echo "One or more jobs failed ($r)"; exit 1 ;;
                    esac
                  done
                  echo "All jobs passed successfully (code=$CODE)"
