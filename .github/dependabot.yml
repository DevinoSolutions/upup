version: 2
updates:
    # Published surface + workspace deps. `npm` ecosystem reads pnpm-lock.yaml (v9).
    # Every directory with a package.json is listed (sdk/ is the parked npm name
    # reservation, not a workspace package). dev is the integration branch.
    - package-ecosystem: 'npm'
      directories:
          - '/'
          - '/apps/*'
          - '/packages/*'
          - '/sdk'
      target-branch: 'dev'
      schedule:
          interval: 'weekly'
          day: 'monday'
      open-pull-requests-limit: 10
      cooldown:
          default-days: 2
      groups:
          security: # security updates ignore cooldown and group separately
              applies-to: security-updates
              patterns: ['*']
          minor-and-patch:
              applies-to: version-updates
              update-types: ['minor', 'patch']
      ignore:
          # Majors are DEFERRED (F-189: Angular 19->22, Storybook 9->10, Tailwind
          # 3->4, TS 5->6, Vite/Rollup/ESLint/jsdom). See audit/deferred-roadmap.md.
          - dependency-name: '*'
            update-types: ['version-update:semver-major']
    - package-ecosystem: 'github-actions'
      directory: '/'
      target-branch: 'dev'
      schedule:
          interval: 'weekly'
      groups:
          github-actions:
              patterns: ['*']
      ignore:
          # changesets/action's major track is coupled to the Changesets CLI major:
          # v2.x refuses to run against CLI v2 (this repo's @changesets/cli). A bump
          # here reds the release pipeline until the CLI is upgraded too, so the two
          # move in one deliberate change, never as a grouped action bump.
          - dependency-name: 'changesets/action'
            update-types: ['version-update:semver-major']
    - package-ecosystem: 'docker'
      directory: '/deploy/site'
      target-branch: 'dev'
      schedule:
          interval: 'weekly'
      groups:
          docker:
              patterns: ['*']
